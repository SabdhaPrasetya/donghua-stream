name: Auto Update Donghua Catalog (Donghive)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  update-donghua:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Donghive Scraper
        run: python server_tools/donghive_scraper.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "DonghiveBot"
          git config --global user.email "bot@donghua.app"
          git add server_tools/donghua_catalog.json
          git diff --staged --quiet || git commit -m "Auto update from Donghive - $(date +%Y-%m-%d)"
          git push
