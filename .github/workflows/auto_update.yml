name: Auto Update Donghua Catalog

on:
  schedule:
    - cron: '0 */6 * * *'  # Berjalan otomatis setiap 6 jam
  workflow_dispatch:       # Tombol untuk memicu manual kapan saja

jobs:
  update-donghua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Jalankan Bot Auto Update
        run: |
          python server_tools/updater.py

      - name: Simpan dan Publikasikan Hasil Update
        run: |
          git config --global user.name "DonghuaBot"
          git config --global user.email "bot@donghua.app"
          git add server_tools/donghua_catalog.json
          git commit -m "Auto update episode donghua terbaru" || exit 0
          git push
