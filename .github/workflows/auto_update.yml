name: Auto Update Donghua Catalog (Multi-Source)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-donghua:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Multi-Source Scraper
        run: python server_tools/multi_source_scraper.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "DonghuaBot"
          git config --global user.email "bot@donghua.app"
          git add server_tools/donghua_catalog.json
          git diff --staged --quiet || git commit -m "Auto update $(date +%Y-%m-%d) - 73 titles, 10K+ episodes"
          git push
