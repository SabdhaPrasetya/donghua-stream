name: Build & Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:       # Tombol manual untuk trigger build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/my-upload-key.jks

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donghua-stream-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v1.0.${{ github.run_number }}
          generate_release_notes: true
          name: "Donghua Stream v1.0.${{ github.run_number }}"
          body: |
            🎬 Donghua Stream - Streaming & Unduhan 4K
            
            ### Fitur Utama:
            - 📺 40+ Judul Donghua dengan Subtitle Indonesia
            - 🎬 Streaming kualitas 4K Ultra HD
            - 📥 Download untuk nonton offline
            - 🔐 VIP subscription dengan GoPay
            - 🎮 Sistem EXP & Kultivasi
            
            ### Cara Install:
            1. Download APK dari release ini
            2. Buka file APK di Android Anda
            3. Izinkan install dari sumber tidak dikenal
            4. Install dan buka aplikasi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
