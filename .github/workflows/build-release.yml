name: Build & Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:       # Tombol manual untuk trigger build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/my-upload-key.jks

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: donghua-stream-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: APK Build Complete
        run: |
          echo "✅ APK berhasil dibuild!"
          echo "📥 Download dari: https://github.com/${{ github.repository }}/actions"
          echo "Klik workflow → scroll ke Artifacts → donghua-stream-release"
